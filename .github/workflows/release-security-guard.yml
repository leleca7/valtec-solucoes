name: Release Security Guard

on:
  push:
    branches:
      - release/candidate-central-valtec
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  secret-guard:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reject tracked environment secret files
        shell: bash
        run: |
          set -euo pipefail
          bad="$(git ls-files | grep -E '(^|/)\.env($|\.)' | grep -vE '(^|/)\.env\.(example|sample|template)$' || true)"
          if [ -n "$bad" ]; then
            echo 'Arquivos .env rastreados não são permitidos:' >&2
            echo "$bad" >&2
            exit 1
          fi

      - name: Scan tracked text for private credential patterns
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          import subprocess

          patterns = {
              'Supabase secret key': re.compile(r'sb_secret_[A-Za-z0-9_-]{10,}'),
              'Supabase service role assignment': re.compile(r'SUPABASE_SERVICE_ROLE(?:_KEY)?\s*[:=]\s*["\'][^"\']+["\']', re.I),
              'OpenAI secret key': re.compile(r'\bsk-(?:proj-)?[A-Za-z0-9_-]{20,}\b'),
              'GitHub personal token': re.compile(r'\bgh[oprsu]_[A-Za-z0-9]{20,}\b'),
              'Vercel token assignment': re.compile(r'VERCEL_TOKEN\s*[:=]\s*["\'][^"\']+["\']', re.I),
              'Private key block': re.compile(r'-----BEGIN (?:RSA |EC |OPENSSH )?PRIVATE KEY-----'),
          }

          failures = []
          files = subprocess.check_output(['git', 'ls-files', '-z']).decode().split('\0')
          for name in files:
              if not name:
                  continue
              path = Path(name)
              try:
                  raw = path.read_bytes()
              except OSError:
                  continue
              if b'\x00' in raw[:8192]:
                  continue
              try:
                  text = raw.decode('utf-8')
              except UnicodeDecodeError:
                  continue
              for label, pattern in patterns.items():
                  if pattern.search(text):
                      failures.append(f'{name}: {label}')

          config = Path('config.js').read_text(encoding='utf-8')
          if not re.search(r'SUPABASE_PUBLISHABLE_KEY\s*:\s*["\']sb_publishable_', config):
              failures.append('config.js: chave Supabase do navegador não está explicitamente no formato publishable')

          if failures:
              raise SystemExit('Possível credencial privada rastreada:\n' + '\n'.join(failures))
          print('Tracked repository secret guard: OK')
          PY
