name: Testes do assistente privado Valtec
on:
  pull_request:
    paths:
      - 'server/whatsapp-owner-assistant*.mjs'
      - 'api/whatsapp-webhook.mjs'
      - 'tests/whatsapp-owner-assistant.test.mjs'
      - '.github/workflows/whatsapp-owner-assistant-tests.yml'
      - 'server/whatsapp-lead-priority.mjs'
      - 'server/whatsapp-owner-evidence.mjs'
      - 'server/whatsapp-owner-operations.mjs'
      - 'tests/whatsapp-owner-operations.test.mjs'
      - 'tests/whatsapp-owner-evidence.test.mjs'
      - 'tests/whatsapp-lead-priority.test.mjs'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regras-seguras:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Validar comandos e mensagens sem IA
        run: node --test tests/whatsapp-owner-assistant.test.mjs tests/whatsapp-lead-priority.test.mjs tests/whatsapp-owner-evidence.test.mjs tests/whatsapp-owner-operations.test.mjs
